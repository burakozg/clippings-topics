[project]
name = "clippings-topics"
version = "0.1.0"
description = "Maps Obsidian vault clippings to topic notes"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }

dependencies = [
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clippings_topics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
